<g><rect x="290" y="40" width="90" height="170" rx="16" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".5"/>
<rect x="302" y="58" width="50" height="10" rx="5" fill="#fff" opacity=".85"/><circle cx="335" cy="120" r="26" fill="url(#ac)"/><rect x="302" y="170" width="66" height="22" rx="11" fill="#fff" opacity=".5"/>

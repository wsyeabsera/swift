<text x="26" y="35" fill="#fff" font-family="ui-monospace,monospace" font-size="19">⌘K  make it pop</text><rect x="268" y="12" width="48" height="32" rx="16" fill="url(#ac)"/><text x="280" y="34" fill="#fff" font-size="18">⏎</text></g>

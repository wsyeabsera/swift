<!doctype html><meta charset=utf-8><title>spike canvas</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05060a}#view{position:fixed;inset:0;overflow:hidden}#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.fr{position:absolute;overflow:hidden;contain:strict;border-radius:12px;box-shadow:0 0 0 1px #fff3}iframe{border:0;display:block}</style>
<div id=view><div id=world></div></div>
<script>
const q=new URLSearchParams(location.search);const mode=q.get('mode')||'same',N=+(q.get('n')||20),FZ=q.get('freeze')||'0',freeze=FZ!=='0';
const KINDS=[['tv',1920,1080],['phone',390,844],['popup',380,600],['email',600,800]];
const ORDER=[0,0,1,0,2,0,1,3,0,1,0,2,0,1,3,0,1,2,3,1];
const css=(w,h)=>`.root{position:relative;margin:0;width:${w}px;height:${h}px;overflow:hidden;font-family:system-ui;color:#f5f5f7;background:linear-gradient(135deg,#0b1a3a,#1a0b3a 50%,#0b3a2a)}
.aur{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 30% 30%,#0a84ff88,transparent),radial-gradient(40% 40% at 70% 60%,#30d15888,transparent);animation:d 12s linear infinite}@keyframes d{to{transform:rotate(360deg)}}
.clock{position:absolute;left:6%;top:8%;font-size:${Math.min(w*.12,h*.2)}px;font-weight:200;letter-spacing:-.03em;color:var(--c,#fff)}
.glass{position:absolute;left:6%;right:6%;bottom:8%;padding:3%;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.2)}
.row{padding:1.2% 0;font-size:${Math.max(14,w*.022)}px;border-bottom:1px solid rgba(255,255,255,.1)}`;
const inner=(w,h,i)=>`<div class=root id=r><div class=aur></div><div class=clock>21:53</div><div class=glass>${[1,2,3,4,5,6].map(k=>`<div class=row>Recent ${i}.${k} · cloudflare/workers-sdk #${16550+k}</div>`).join('')}</div></div>`;
const frames=[];const world=document.getElementById('world');let x=0,y=0,rowH=0;const pending=new Map();
addEventListener('message',e=>{if(e.data&&e.data.t==='ack'){const f=pending.get(e.data.id);if(f){pending.delete(e.data.id);f(performance.now())}}});
for(let i=0;i<N;i++){const [k,w,h]=KINDS[ORDER[i%ORDER.length]];if(x+w>9000){x=0;y+=rowH+120;rowH=0}
 const el=document.createElement('div');el.className='fr';el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
 const f={el,x,y,w,h,vis:true};
 if(mode==='same'||mode==='sandbox'){const ifr=document.createElement('iframe');ifr.width=w;ifr.height=h;
  const script=mode==='sandbox'?`<script>onmessage=e=>{if(e.data.t==='edit'){document.getElementById('r').style.setProperty('--c',e.data.v);requestAnimationFrame(()=>parent.postMessage({t:'ack',id:e.data.id},'*'))}}<\/script>`:'';
  if(mode==='sandbox')ifr.setAttribute('sandbox','allow-scripts');
  f.doc=`<!doctype html><style>html,body{margin:0}${css(w,h)}</style>${inner(w,h,i)}${script}`;ifr.srcdoc=f.doc;el.appendChild(ifr);f.ifr=ifr}
 else{const host=el;const root=mode==='shadow'?host.attachShadow({mode:'open'}):host;root.innerHTML=`<style>${css(w,h)}</style>${inner(w,h,i)}`;f.root=root}
 world.appendChild(el);frames.push(f);x+=w+120;rowH=Math.max(rowH,h)}

const IMG=q.get('img8k');if(IMG){const el=document.createElement('div');el.className='fr';el.style.cssText='left:2000px;top:100px;width:1920px;height:1080px;z-index:5';const im=document.createElement('img');im.src=IMG==='full'?'../imaging/test8k.jpg':'../imaging/out/sharp-1920.jpg';im.style.cssText='width:1920px;height:1080px;display:block;object-fit:cover';el.appendChild(im);world.appendChild(el);frames.push({el,x:2000,y:100,w:1920,h:1080,vis:true})}
const state={tx:0,ty:0,s:.25};const apply=()=>{world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.s})`;if(freeze)for(const f of frames){const l=f.x*state.s+state.tx,t=f.y*state.s+state.ty,v=l<innerWidth&&l+f.w*state.s>0&&t<innerHeight&&t+f.h*state.s>0;if(v!==f.vis){f.vis=v;if(FZ==='1')f.el.style.visibility=v?'visible':'hidden';else if(FZ==='2')f.el.style.display=v?'block':'none';else if(FZ==='3'&&f.ifr){if(v){f.ifr.srcdoc=f.doc}else{f.ifr.removeAttribute('srcdoc');f.ifr.src='about:blank'}}}}};
const stats=a=>{a=[...a].sort((p,q)=>p-q);const g=p=>a[Math.min(a.length-1,Math.floor(a.length*p))];return{n:a.length,p50:+g(.5).toFixed(1),p95:+g(.95).toFixed(1),max:+a[a.length-1].toFixed(1),over20:a.filter(v=>v>20).length}};
function anim(ms,step){return new Promise(res=>{const d=[];let last=0,t0=0;const tick=t=>{if(!t0){t0=t;last=t;requestAnimationFrame(tick);return}d.push(t-last);last=t;const p=Math.min(1,(t-t0)/ms);step(p);apply();p<1?requestAnimationFrame(tick):res(stats(d))};requestAnimationFrame(tick)})}
window.runBench=async()=>{const out={mode,N,freeze};apply();await new Promise(r=>setTimeout(r,1500));
 state.s=.25;state.tx=0;state.ty=0;out.pan=await anim(2500,p=>{state.tx=-p*4000});
 state.tx=-200;state.ty=-100;out.zoom=await anim(2500,p=>{const s=.1+p*.5;state.tx=-200+(1-s/.25)*0;state.s=s});
 state.s=.25;state.tx=-600;state.ty=0;apply();await new Promise(r=>setTimeout(r,800));
 const inView=frames.filter(f=>(f.ifr||f.root)&&(()=>{const l=f.x*state.s+state.tx,t=f.y*state.s+state.ty;return l<innerWidth&&l+f.w*state.s>0&&t<innerHeight&&t+f.h*state.s>0})());out.visibleFrames=inView.length;const lat=[];for(let i=0;i<30;i++){const f=inView[i%inView.length];const v='hsl('+(i*37%360)+' 80% 70%)';const t0=performance.now();
  if(mode==='sandbox'){await new Promise(res=>{const id='e'+i;pending.set(id,res);setTimeout(()=>{if(pending.delete(id))res()},3000);f.ifr.contentWindow.postMessage({t:'edit',id,v},'*')});lat.push(performance.now()-t0)}
  else{const r=f.ifr?f.ifr.contentDocument.getElementById('r'):f.root.getElementById?f.root.getElementById('r'):f.root.querySelector('#r');r.style.setProperty('--c',v);await new Promise(res=>requestAnimationFrame(res));lat.push(performance.now()-t0)}}
 out.tier0=stats(lat);return out};

const glassMode=q.get('glass')||'none';
if(glassMode!=='none'){const st=document.createElement('style');st.textContent=`.lqg{position:fixed;z-index:9;background:radial-gradient(120% 70% at 18% -10%,rgba(255,255,255,.22),transparent 55%),linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 45%,rgba(255,255,255,.05)),rgba(24,26,34,.30);backdrop-filter:blur(22px) saturate(190%) brightness(1.05);border:1px solid rgba(255,255,255,.14);box-shadow:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.5),inset -1px -1px 0 -.5px rgba(255,255,255,.16),inset 0 0 22px rgba(255,255,255,.06),0 14px 40px rgba(0,0,0,.28)}.lqg.rf{backdrop-filter:url(#lgr) blur(10px) saturate(190%) brightness(1.06)}`;document.head.appendChild(st);
const band=10,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><linearGradient id="l"><stop offset="0" stop-color="rgb(255,128,128)"/><stop offset="1" stop-color="rgb(128,128,128)" stop-opacity="0"/></linearGradient><linearGradient id="r"><stop offset="0" stop-color="rgb(128,128,128)" stop-opacity="0"/><stop offset="1" stop-color="rgb(0,128,128)"/></linearGradient><linearGradient id="t" x2="0" y2="1"><stop offset="0" stop-color="rgb(128,255,128)"/><stop offset="1" stop-color="rgb(128,128,128)" stop-opacity="0"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop offset="0" stop-color="rgb(128,128,128)" stop-opacity="0"/><stop offset="1" stop-color="rgb(128,0,128)"/></linearGradient></defs><rect width="200" height="200" fill="rgb(128,128,128)"/><rect width="${2*band}" height="200" fill="url(#l)"/><rect x="${200-2*band}" width="${2*band}" height="200" fill="url(#r)"/><rect width="200" height="${2*band}" fill="url(#t)"/><rect y="${200-2*band}" width="200" height="${2*band}" fill="url(#b)"/></svg>`;
const ns='http://www.w3.org/2000/svg';const sv=document.createElementNS(ns,'svg');sv.setAttribute('width',0);sv.setAttribute('height',0);sv.style.position='absolute';sv.innerHTML=`<filter id="lgr" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feImage href="data:image/svg+xml;utf8,${encodeURIComponent(svg)}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="44" xChannelSelector="R" yChannelSelector="G"/></filter>`;document.body.appendChild(sv);
[[40,24,760,56,28],[40,110,360,230,30],[420,110,300,60,30],[420,190,300,150,30],[1000,24,380,56,28],[1000,110,380,230,30]].forEach(([l,t,w,h,r])=>{const d=document.createElement('div');d.className='lqg'+(glassMode==='refract'?' rf':'');d.style.cssText=`left:${l}px;top:${t}px;width:${w}px;height:${h}px;border-radius:${r}px`;document.body.appendChild(d)})}
window.__ready=true;
</script>

<!doctype html><meta charset=utf-8><title>spike canvas</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05060a}#view{position:fixed;inset:0;overflow:hidden}#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.fr{position:absolute;overflow:hidden;contain:strict;border-radius:12px;box-shadow:0 0 0 1px #fff3}iframe{border:0;display:block}</style>
<div id=view><div id=world></div></div>
<script>
const q=new URLSearchParams(location.search);const mode=q.get('mode')||'same',N=+(q.get('n')||20),freeze=q.get('freeze')==='1';
const KINDS=[['tv',1920,1080],['phone',390,844],['popup',380,600],['email',600,800]];
const ORDER=[0,0,1,0,2,0,1,3,0,1,0,2,0,1,3,0,1,2,3,1];
const css=(w,h)=>`.root{position:relative;margin:0;width:${w}px;height:${h}px;overflow:hidden;font-family:system-ui;color:#f5f5f7;background:linear-gradient(135deg,#0b1a3a,#1a0b3a 50%,#0b3a2a)}
.aur{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 30% 30%,#0a84ff88,transparent),radial-gradient(40% 40% at 70% 60%,#30d15888,transparent);animation:d 12s linear infinite}@keyframes d{to{transform:rotate(360deg)}}
.clock{position:absolute;left:6%;top:8%;font-size:${Math.min(w*.12,h*.2)}px;font-weight:200;letter-spacing:-.03em;color:var(--c,#fff)}
.glass{position:absolute;left:6%;right:6%;bottom:8%;padding:3%;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.2)}
.row{padding:1.2% 0;font-size:${Math.max(14,w*.022)}px;border-bottom:1px solid rgba(255,255,255,.1)}`;
const inner=(w,h,i)=>`<div class=root id=r><div class=aur></div><div class=clock>21:53</div><div class=glass>${[1,2,3,4,5,6].map(k=>`<div class=row>Recent ${i}.${k} · cloudflare/workers-sdk #${16550+k}</div>`).join('')}</div></div>`;
const frames=[];const world=document.getElementById('world');let x=0,y=0,rowH=0;const pending=new Map();
addEventListener('message',e=>{if(e.data&&e.data.t==='ack'){const f=pending.get(e.data.id);if(f){pending.delete(e.data.id);f(performance.now())}}});
for(let i=0;i<N;i++){const [k,w,h]=KINDS[ORDER[i%ORDER.length]];if(x+w>9000){x=0;y+=rowH+120;rowH=0}
 const el=document.createElement('div');el.className='fr';el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
 const f={el,x,y,w,h,vis:true};
 if(mode==='same'||mode==='sandbox'){const ifr=document.createElement('iframe');ifr.width=w;ifr.height=h;
  const script=mode==='sandbox'?`<script>onmessage=e=>{if(e.data.t==='edit'){document.getElementById('r').style.setProperty('--c',e.data.v);requestAnimationFrame(()=>parent.postMessage({t:'ack',id:e.data.id},'*'))}}<\/script>`:'';
  if(mode==='sandbox')ifr.setAttribute('sandbox','allow-scripts');
  ifr.srcdoc=`<!doctype html><style>html,body{margin:0}${css(w,h)}</style>${inner(w,h,i)}${script}`;el.appendChild(ifr);f.ifr=ifr}
 else{const host=el;const root=mode==='shadow'?host.attachShadow({mode:'open'}):host;root.innerHTML=`<style>${css(w,h)}</style>${inner(w,h,i)}`;f.root=root}
 world.appendChild(el);frames.push(f);x+=w+120;rowH=Math.max(rowH,h)}
const state={tx:0,ty:0,s:.25};const apply=()=>{world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.s})`;if(freeze)for(const f of frames){const l=f.x*state.s+state.tx,t=f.y*state.s+state.ty,v=l<innerWidth&&l+f.w*state.s>0&&t<innerHeight&&t+f.h*state.s>0;if(v!==f.vis){f.vis=v;f.el.style.visibility=v?'visible':'hidden'}}};
const stats=a=>{a=[...a].sort((p,q)=>p-q);const g=p=>a[Math.min(a.length-1,Math.floor(a.length*p))];return{n:a.length,p50:+g(.5).toFixed(1),p95:+g(.95).toFixed(1),max:+a[a.length-1].toFixed(1),over20:a.filter(v=>v>20).length}};
function anim(ms,step){return new Promise(res=>{const d=[];let last=0,t0=0;const tick=t=>{if(!t0){t0=t;last=t;requestAnimationFrame(tick);return}d.push(t-last);last=t;const p=Math.min(1,(t-t0)/ms);step(p);apply();p<1?requestAnimationFrame(tick):res(stats(d))};requestAnimationFrame(tick)})}
window.runBench=async()=>{const out={mode,N,freeze};apply();await new Promise(r=>setTimeout(r,1500));
 state.s=.25;state.tx=0;state.ty=0;out.pan=await anim(2500,p=>{state.tx=-p*4000});
 state.tx=-200;state.ty=-100;out.zoom=await anim(2500,p=>{const s=.1+p*.5;state.tx=-200+(1-s/.25)*0;state.s=s});
 state.s=.25;state.tx=-600;state.ty=0;apply();await new Promise(r=>setTimeout(r,800));
 const inView=frames.filter(f=>{const l=f.x*state.s+state.tx,t=f.y*state.s+state.ty;return l<innerWidth&&l+f.w*state.s>0&&t<innerHeight&&t+f.h*state.s>0});out.visibleFrames=inView.length;const lat=[];for(let i=0;i<30;i++){const f=inView[i%inView.length];const v='hsl('+(i*37%360)+' 80% 70%)';const t0=performance.now();
  if(mode==='sandbox'){await new Promise(res=>{const id='e'+i;pending.set(id,res);setTimeout(()=>{if(pending.delete(id))res()},3000);f.ifr.contentWindow.postMessage({t:'edit',id,v},'*')});lat.push(performance.now()-t0)}
  else{const r=f.ifr?f.ifr.contentDocument.getElementById('r'):f.root.getElementById?f.root.getElementById('r'):f.root.querySelector('#r');r.style.setProperty('--c',v);await new Promise(res=>requestAnimationFrame(res));lat.push(performance.now()-t0)}}
 out.tier0=stats(lat);return out};
window.__ready=true;
</script>

<!doctype html><meta charset=utf-8><div id=probe style="height:100vh;width:100vw;position:fixed"></div>
<script>
onmessage = e => {
  if (e.data.t === 'ping') parent.postMessage({ t: 'pong', id: e.data.id }, '*');
  if (e.data.t === 'hello') parent.postMessage({ t: 'info', origin: location.origin, innerH: innerHeight, vhPx: document.getElementById('probe').getBoundingClientRect().height, hasChrome: typeof chrome !== 'undefined' && !!chrome.runtime }, '*');
};
</script>
